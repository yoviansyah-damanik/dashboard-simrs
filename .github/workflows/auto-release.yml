name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Sync GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # Membuat GitHub Release untuk setiap versi di version.json yang belum punya release
      # Lengkap dengan tag, judul rilis, badge rilis, tanggal, dan changelog.
      - name: Sync Missing GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php scripts/sync-github-releases.php
