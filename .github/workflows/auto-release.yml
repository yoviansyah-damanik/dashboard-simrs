name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Extract Latest Version and Changelog
        id: version_info
        run: php scripts/generate-release-notes.php

      - name: Check if Tag Already Exists
        id: check_tag
        run: |
          TAG="${{ steps.version_info.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG sudah ada secara lokal."
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG sudah ada di remote GitHub."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG belum ada. Memulai proses pembuatan release."
          fi

      - name: Create Git Tag & GitHub Release
        if: steps.check_tag.outputs.exists == 'false' && steps.version_info.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: ${{ steps.version_info.outputs.tag_name }} - ${{ steps.version_info.outputs.release_title }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
